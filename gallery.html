<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House of the Beauharnais</title>
    <link rel="icon" href="imgs/logo.png" type="png"/>
    <link rel="stylesheet" href="files/css_main.css">
</head>
<body>
<header id="header"></header>

<div class="container">
    <!-- Page Art -->
    <div id="art" class="page active">
        <div class="card">
            <h2>Gallerie - Productions de la Famille</h2>

            Here

        </div>
    </div>
</div>

<footer id="footer"> </footer>

<script>
    fetch('/files/header.html')
        .then(response => response.text())
        .then(data => {
            var container = document.getElementById('header');
            container.innerHTML = data;

            container.querySelectorAll('script').forEach(function (old) {
                var script = document.createElement('script');
                script.textContent = old.textContent;
                old.replaceWith(script);
            });
        });
</script>
<script>
    fetch('/files/footer.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('footer').innerHTML = data;
        });
</script>

<script type="text/javascript" src="/files/js_wiki.js"></script>

</body>
</html>
