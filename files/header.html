<!-- Header for the site -->
<html lang="fr">
<div class="header-content">
    <a class="logo-section" href="/">
        <div class="logo"><img src="/imgs/logo.png" alt="Blason de la Famille" data-en="Family Crest" width="50" height="50"></div>
        <div class="site-title" data-en="HOUSE OF THE BEAUHARNAIS">MAISON BEAUHARNAIS</div>
    </a>
    <button class="mobile-menu-btn" onclick="toggleMenu()">☰</button>
    <nav id="nav">
        <!-- Plus de "active" en dur : le script s'en charge -->
        <button class="nav-link" data-en="Home" onclick="window.location='/'">Accueil</button>
        <button class="nav-link" data-en="Family" onclick="window.location='/family.html'">Famille</button>
        <button class="nav-link" data-en="Cabinet" onclick="window.location='/cabinet.html'">Cabinet</button>
        <button class="nav-link" data-en="Wiki" onclick="window.location='/wiki.html'">Wiki</button>
        <button class="nav-link" data-en="Links" onclick="window.location='/links.html'">Liens</button>
        <button class="nav-link" id="lang-btn" onclick="switchLang()">EN</button>
    </nav>
</div>
</html>

<script>
    // Vrai si on est dans la version anglaise (/en ou /en/...)
    function isEnglish() {
        return /^\/en(\/|$)/.test(window.location.pathname);
    }

    // Change de langue : ajoute /en/ si on est en FR, l'enlève si on est en EN
    function switchLang() {
        var path = window.location.pathname;
        var newPath;

        if (isEnglish()) {
            newPath = path.replace(/^\/en/, '') || '/';
        } else {
            newPath = '/en' + (path === '/' ? '/' : path);
        }

        window.location = newPath + window.location.search + window.location.hash;
    }

    // Le bouton affiche "FR" quand on est en anglais, "EN" sinon
    function setLangButton() {
        var btn = document.getElementById('lang-btn');
        if (btn) btn.textContent = isEnglish() ? 'FR' : 'EN';
    }

    // En version anglaise, remplace les textes par leur version data-en
    function translateHeader() {
        if (!isEnglish()) return;

        document.documentElement.lang = 'en';

        document.querySelectorAll('.nav-link[data-en], .site-title[data-en]').forEach(function (el) {
            el.textContent = el.getAttribute('data-en');
        });

        var logo = document.querySelector('.logo img[data-en]');
        if (logo) logo.alt = logo.getAttribute('data-en');
    }

    // Met la classe "active" sur le bouton de la page actuelle
    function setActiveNav() {
        // Normalise un chemin : enlève "index.html", ".html" et le "/" final
        function clean(path) {
            return path.replace(/index\.html$/, '').replace(/\.html$/, '').replace(/\/+$/, '') || '/';
        }

        // On ignore le préfixe /en pour comparer avec les liens du menu
        var current = clean(window.location.pathname.replace(/^\/en(?=\/|$)/, '') || '/');

        document.querySelectorAll('#nav .nav-link').forEach(function (btn) {
            // Récupère l'URL dans le onclick
            var match = (btn.getAttribute('onclick') || '').match(/'([^']+)'/);
            if (!match) return;

            var target = new URL(match[1], window.location.origin);

            // Ignore les liens vers un autre domaine
            if (target.origin !== window.location.origin) return;

            var t = clean(target.pathname);
            var isActive = (t === '/')
                ? current === '/'                                   // Accueil : exact seulement
                : (current === t || current.startsWith(t + '/'));   // sections : inclut les sous-pages

            btn.classList.toggle('active', isActive);
        });
    }

    // En version anglaise, les boutons du menu pointent vers /en/...
    function prefixNavLinks() {
        if (!isEnglish()) return;

        document.querySelectorAll('#nav .nav-link').forEach(function (btn) {
            var onclick = btn.getAttribute('onclick') || '';
            var match = onclick.match(/'([^']+)'/);
            if (!match) return;

            var url = match[1];
            // Seulement les liens internes (commençant par "/") pas déjà en /en
            if (url.charAt(0) !== '/' || /^\/en(\/|$)/.test(url)) return;

            var newUrl = '/en' + url;
            btn.setAttribute('onclick', "window.location='" + newUrl + "'");
        });
    }

    function initHeader() {
        setLangButton();
        translateHeader(); // textes en anglais si on est sur /en
        setActiveNav();    // d'abord, avec les liens d'origine
        prefixNavLinks();  // ensuite, on ajoute /en/ si besoin
    }

    // Lance tout de suite si la page est déjà chargée, sinon attend
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initHeader);
    } else {
        initHeader();
    }
</script>
